<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#00897b">
  <title>Store — Sellify</title>
  <style>
    :root{--brand:#00897b;--ink:#172026;--muted:#68737b;--line:#e5e8ea;--surface:#fff;--bg:#f6f8f8}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .wrap{max-width:980px;margin:0 auto;padding:0 16px 48px}.hero{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
    .hero-in{max-width:980px;margin:auto;padding:14px 16px}.brand{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:42px;height:42px;border-radius:12px;object-fit:cover;background:#eef2f2;display:none}.brand h1{font-size:20px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}
    .search{margin-top:12px;display:flex;gap:8px}.search input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:15px;outline:none}.search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 14%,transparent)}
    .pills{display:flex;gap:7px;overflow:auto;padding:12px 0 2px}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;white-space:nowrap;font-size:13px;cursor:pointer}.pill.active{background:var(--brand);border-color:var(--brand);color:#fff}
    .state{padding:28px 8px;text-align:center;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}.photo{width:100%;aspect-ratio:1.15;background:#edf1f1;object-fit:cover;display:block}.photo-placeholder{width:100%;aspect-ratio:1.15;display:grid;place-items:center;color:#98a1a6;background:#edf1f1;font-size:30px}.body{padding:12px}.name{font-weight:700;font-size:15px;line-height:1.3}.category{font-size:11px;color:var(--muted);margin-top:4px}.price{font-weight:800;color:var(--brand);font-size:15px;margin-top:9px}.unit{font-weight:500;color:var(--muted);font-size:11px}.availability{font-size:11px;margin-top:6px}.available{color:#2e7d32}.unavailable{color:#b42318}.orders-link{display:none;margin:12px 0 0}.orders-link button, .fulfillment-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer}.footer{text-align:center;color:var(--muted);font-size:11px;margin-top:28px}
    @media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.hero-in{padding-left:24px;padding-right:24px}.wrap{padding-left:24px;padding-right:24px}}
  .buy-row{margin-top:10px}.add-btn,.submit,.cart-action{border:0;border-radius:10px;background:var(--brand);color:#fff;font-weight:700;padding:10px 12px;cursor:pointer;width:100%}.cart-bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:20;display:none;align-items:center;gap:12px;justify-content:space-between;width:min(92vw,520px);padding:10px 12px;background:#172026;color:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.2)}.cart-action{width:auto;background:var(--brand)}.modal{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.42);padding:16px}.modal-card{width:min(100%,520px);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.modal-head{display:flex;align-items:center;justify-content:space-between}.modal h2{margin:0 0 14px}.close{border:0;background:transparent;font-size:28px;cursor:pointer}.checkout-line,.checkout-total{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.checkout-total{font-weight:800;border-bottom:0;margin-bottom:8px}.modal label{display:grid;gap:5px;font-size:12px;font-weight:700;margin:10px 0}.modal input{padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}.error{min-height:20px;color:#b42318;font-size:12px;margin:6px 0}.success{text-align:center;padding:28px 20px}.success p{color:var(--muted);line-height:1.5;margin-bottom:18px}.submit:disabled{opacity:.6;cursor:wait}</style>
</head>
<body>
  <header class="hero"><div class="hero-in">
    <div class="brand"><img id="storeLogo" class="logo" alt=""><div><h1 id="storeName">Sellify Store</h1><p id="storeStatus">Loading catalog…</p></div></div>
    <div class="search"><input id="storeSearch" type="search" placeholder="Search products…" autocomplete="off"></div>
    <div id="categoryPills" class="pills" aria-label="Categories"></div>
  </div></header>
  <main class="wrap"><div id="telegramOrders" class="orders-link"><button id="openOrders">My orders</button></div><div id="storeState" class="state">Loading catalog…</div><section id="storeGrid" class="grid" aria-live="polite"></section><div class="footer">Powered by Sellify</div></main>
  <div id="cartBar" class="cart-bar"><span id="cartSummary">0 items</span><button id="openCart" class="cart-action">Checkout</button></div>
  <div id="checkoutModal" class="modal"><div class="modal-card"><div class="modal-head"><h2>Your order</h2><button id="closeCheckout" class="close" aria-label="Close">×</button></div><div id="checkoutItems"></div><div class="checkout-total"><span>Total</span><strong id="checkoutTotal">0</strong></div><label>Name<input id="buyerName" autocomplete="name" maxlength="120" placeholder="Your name"></label><label>Phone (optional)<input id="buyerPhone" autocomplete="tel" maxlength="40" placeholder="Phone number"></label><div id="checkoutError" class="error" role="alert"></div><button id="submitOrder" class="submit">Place order</button></div></div>
  <div id="ordersModal" class="modal"><div class="modal-card"><div class="modal-head"><h2>My orders</h2><button id="closeOrders" class="close" aria-label="Close">×</button></div><div id="ordersState" class="state">Loading orders…</div><div id="ordersList"></div><div id="fulfillmentState" class="state" style="display:none"></div></div></div>
  <div id="successModal" class="modal"><div class="modal-card success"><h2>Order received</h2><p id="successText"></p><a id="trackOrder" class="submit" href="#">Track order</a><button id="closeSuccess" class="submit">Done</button></div></div>
  <script type="module" src="/store.js"></script>
</body>
</html>
