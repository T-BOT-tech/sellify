name: Repository Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject committed local secrets and runtime state
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|.*\.pem|.*\.key|.*\.p12|.*\.pfx)$' | grep -v '^\.env\.example$'; then
            echo 'Potential secret file is tracked.'
            exit 1
          fi
          if git ls-files | grep -E '(^|/)(data|backups)/|\.sqlite(-shm|-wal)?$'; then
            echo 'Runtime database/backup state must not be committed.'
            exit 1
          fi
