name: Supplier Network trust qualification visibility regression

on:
  push:
    branches:
      - audit/supplier-network-trust-visibility-20261123
    paths:
      - '.github/workflows/supplier-network-trust-visibility.yml'
      - 'backend/lib/store-sqlite.js'
      - 'phase0/supplier-network-trust-qualification-visibility-regression.mjs'
  pull_request:
    paths:
      - '.github/workflows/supplier-network-trust-visibility.yml'
      - 'backend/lib/store-sqlite.js'
      - 'phase0/supplier-network-trust-qualification-visibility-regression.mjs'

permissions:
  contents: read

jobs:
  supplier_network_trust_visibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install root dependencies
        run: npm install --ignore-scripts
      - name: Supplier Network trust qualification visibility regression
        run: node phase0/supplier-network-trust-qualification-visibility-regression.mjs
