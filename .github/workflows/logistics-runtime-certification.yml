name: Logistics Runtime Certification

# This gate depends on shared tenant/auth/backend contracts, so it must not be skipped by path filtering.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  logistics-certification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-package-lock
      - run: npm run test:logistics-master-exit
      - run: npm run test:logistics-l8-l21-certification
