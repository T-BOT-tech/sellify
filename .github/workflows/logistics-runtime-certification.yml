name: Logistics Runtime Certification

# This gate depends on shared tenant/auth/backend contracts, so it must not be skipped by path filtering.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logistics-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run test:logistics-master-exit
      - run: npm run test:logistics-l8-l21-certification
      - name: Phase 16.13 Logistics provider stack cumulative regression
        run: npm run test:phase16.13-logistics-provider
