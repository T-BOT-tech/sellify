      - name: Verify runtime
        run: node --version

      - name: Install root dependencies
        run: npm install --ignore-scripts
      - name: Install Chromium system dependencies for outbox browser runtime regression
        timeout-minutes: 10
        run: npx playwright install-deps chromium
      - name: Install Chromium browser for outbox browser runtime regression
        timeout-minutes: 10
        run: npx playwright install chromium


      - name: Ecosystem Add menu regression
        run: node phase0/ecosystem-add-menu-regression.mjs
