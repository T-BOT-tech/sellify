name: Sellify CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify runtime
        run: node --version

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Syntax check core entrypoints
        run: |
          node --check backend/server.js
          node --check backend/backup.js
          node --check phase0/golden-regression.mjs

      - name: Run baseline regression
        run: npm run phase0:test

      - name: FUX-31 frontend identity regression
        run: npm run test:fux-31
      - name: FUX-31 accessibility source regression
        run: npm run test:fux-31-accessibility
      - name: FUX-42 core fulfillment regression
        run: npm run test:fux-42
      - name: FUX-44 frontend fulfillment authority regression
        run: npm run test:fux-44
      - name: FUX-46 canonical inventory mutation regression
        run: npm run test:fux-46
      - name: FUX-47 canonical inventory projection regression
        run: npm run test:fux-47
      - name: FUX-48 canonical warehouse history regression
        run: npm run test:fux-48
      - name: FUX-49 legacy inventory authority regression
        run: npm run test:fux-49
      - name: FUX-50 inventory outbox replay regression
        run: npm run test:fux-50
      - name: FUX-51 legacy inventory authority regression
        run: npm run test:fux-51
      - name: FUX-52 cross-pack inventory authority regression
        run: npm run test:fux-52
      - name: FUX-53 B2B quotes frontend authority regression
        run: npm run test:fux-53
      - name: FUX-54 compliance frontend authority regression
        run: npm run test:fux-54
      - name: FUX-55 seller storefront channel authority regression
        run: npm run test:fux-55
      - name: FUX-56 B2B customer pricing authority regression
        run: npm run test:fux-56
      - name: FUX-57 canonical business location management authority regression
        run: npm run test:fux-57
      - name: GAP-1.10 payment concurrency and durable idempotency certification
        run: npm run gap-1.10:payment-concurrency-test
      - name: GAP-1.11 payment provider status lifecycle regression
        run: npm run gap-1.11:payment-status-test
      - name: GAP-1.12 provider-neutral payment reconciliation regression
        run: npm run gap-1.12:payment-reconciliation-test
      - name: GAP-1.13 payment failure expiration cancellation reversal regression
        run: npm run gap-1.13:payment-lifecycle-test
      - name: GAP-1.14 durable payment refund lifecycle regression
        run: npm run gap-1.14:payment-refund-test
      - name: GAP-1.15 settlement and fee model regression
        run: npm run gap-1.15:payment-settlement-test
      - name: GAP-1.16 executable payment routing regression
        run: npm run gap-1.16:payment-routing-test
      - name: GAP-1.17 payment operational timeline retry recovery manual review regression
        run: npm run gap-1.17:payment-operations-test
      - name: GAP-2 logistics authorization foundation regression
        run: npm run test:gap-2-logistics-authz
      - name: GAP-2 delivery assignment authority regression
        run: npm run test:gap-2-delivery-assignment
      - name: GAP-2 delivery assignment lifecycle regression
        run: npm run test:gap-2-delivery-lifecycle
      - name: GAP-2 delivery exception resolution regression
        run: npm run test:gap-2-delivery-exception
      - name: GAP-2 dispatch workload regression
        run: npm run test:gap-2-dispatch-workload
      - name: GAP-2 delivery frontend contract regression
        run: npm run test:gap-2-delivery-frontend
