name: Sellify CI

on:
  push:
    branches: [main, fix/gap-1-18-migration63-recovery]
  pull_request:

permissions:
  contents: read

jobs:
  logistics_l18:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install root dependencies
        run: npm install --ignore-scripts
      - name: GAP-2 canonical delivery assignment authority regression
        run: node phase0/gap-2-delivery-assignment-authority-regression.mjs
      - name: Logistics service delivery-model contract regression
        run: npm run test:logistics-service-delivery-model
      - name: Queued fulfillment target reconciliation regression
        run: npm run test:fulfillment-queued-target-reconciliation
      - name: Run L18 P2P Delivery product boundary regression
        run: npm run test:logistics-l18

  logistics_exit_certification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install root dependencies
        run: npm install --ignore-scripts
      - name: Audit Logistics master specification and authority boundaries
        run: node phase0/logistics-master-specification-exit-audit.mjs
      - name: Execute L1-L7 cumulative regression gate
        run: npm run test:phase13.10.15
      - name: Execute L8-L21 cumulative exit certification
        run: npm run test:logistics-l8-l21-certification

  baseline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
