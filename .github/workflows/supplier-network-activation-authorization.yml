name: Supplier Network activation authorization regression

on:
  push:
    branches:
      - audit/supplier-network-activation-auth-20261123
    paths:
      - '.github/workflows/supplier-network-activation-authorization.yml'
      - 'backend/server.js'
      - 'backend/lib/authorization.js'
      - 'backend/lib/store-sqlite.js'
      - 'phase0/supplier-network-activation-http-authorization-regression.mjs'
  pull_request:
    paths:
      - '.github/workflows/supplier-network-activation-authorization.yml'
      - 'backend/server.js'
      - 'backend/lib/authorization.js'
      - 'backend/lib/store-sqlite.js'
      - 'phase0/supplier-network-activation-http-authorization-regression.mjs'

permissions:
  contents: read

jobs:
  supplier_network_activation_authorization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install root dependencies
        run: npm install --ignore-scripts
      - name: Supplier Network activation HTTP authorization regression
        run: node phase0/supplier-network-activation-http-authorization-regression.mjs
