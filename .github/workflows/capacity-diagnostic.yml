name: Capacity evidence diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - audit/perplexity-codebase-modularity-20261122

permissions:
  contents: read

jobs:
  probe-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: node phase0/capacity-diagnostic-probe.mjs contract

  probe-database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
