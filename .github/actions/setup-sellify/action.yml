name: Setup Sellify toolchain
description: Install the repository-pinned Node/npm dependencies and optionally cache/install Playwright browsers.

inputs:
  install-playwright:
    description: Install the Playwright Chromium browser and runner dependencies
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Node.js from repository version
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Install locked dependencies
      shell: bash
      run: npm ci --ignore-scripts

    - name: Cache Playwright browsers
      if: inputs.install-playwright == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install Playwright Chromium
      if: inputs.install-playwright == 'true'
      shell: bash
      run: npx playwright install --with-deps chromium
